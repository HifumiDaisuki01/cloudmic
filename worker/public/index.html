<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7fb"><meta name="color-scheme" content="light dark"><title>CloudMic · 让文字成为声音</title><link rel="icon" href="/mark.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><main>
<header><a class="brand" href="/" aria-label="CloudMic 首页"><img src="/mark.svg" width="36" height="36" alt=""><span>CloudMic<small>NEXT GENERATION</small></span></a><span id="connection" class="pill" role="status">未连接</span></header>
<section id="pairPanel" class="card pairing"><div class="eyebrow">YOUR WORDS. YOUR VOICE.</div><h1>让文字，<br>成为你的声音<span>。</span></h1><p class="muted">打开电脑端 CloudMic，扫描二维码。<br>也可以输入电脑上显示的 8 位配对码。</p><form id="pairForm"><label for="code">配对码</label><div class="pairRow"><input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="ABCD EFGH" required aria-describedby="pairError"><button id="pairButton" type="submit">连接电脑 <span aria-hidden="true">↗</span></button></div><p id="pairError" role="alert"></p></form><div class="pairFoot"><span class="tinyDot"></span>无需下载 App · 安全连接 · 文字实时传递</div></section>
<section id="composePanel" hidden>
<div class="intro"><div><div class="eyebrow">READY WHEN YOU ARE</div><h1>想说的话，打出来。</h1></div><button id="disconnect" class="quiet">断开配对</button></div>
<div class="card composer"><label for="text">发送到电脑麦克风</label><textarea id="text" rows="4" maxlength="500" placeholder="在这里输入想说的话…"></textarea><div class="composeActions"><span id="count" class="muted">0 / 500</span><div><button id="stop" class="quiet">停止朗读</button><button id="send" disabled>发送并朗读 <span aria-hidden="true">↗</span></button></div></div><p id="sendHint" class="hint" role="status">等待电脑上线</p></div>
<div class="sectionTitle"><h2>随手一句</h2><button id="editPhrases" class="textButton">编辑短语</button></div><div id="phrases" class="phrases"></div>
<div class="sectionTitle"><h2>本次对话</h2><button id="clearHistory" class="textButton">清空</button></div><div id="history" role="log" aria-live="polite"><div class="empty">每句话的朗读进度，都会在这里显示。</div></div>
</section>
<footer><span>为每一种表达，留一个声音。</span><a href="https://github.com/HifumiDaisuki01/cloudmic" target="_blank" rel="noopener noreferrer">CloudMic 2.0 · Keran Technology ↗</a></footer>
</main><dialog id="phraseDialog"><form id="phraseForm"><h2>你的常用短语</h2><p class="muted">每行一句，最多 12 句。只保存在本机浏览器。</p><textarea id="phraseText" rows="8" maxlength="2400" aria-label="常用短语，每行一句"></textarea><div class="dialogActions"><button type="button" id="cancelPhrases" class="quiet">取消</button><button type="submit">保存</button></div></form></dialog></body></html>
